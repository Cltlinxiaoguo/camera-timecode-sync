[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra -q --strict-markers
markers =
    slow: 慢速集成测试，依赖真实 PaddleOCR / rawpy / 大量样本图（默认 -m "not slow" 排除）
    integration: 端到端集成测试（依赖磁盘真实环境）
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
